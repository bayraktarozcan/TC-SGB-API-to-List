name: "Bug Report / Hata Raporu"
description: "Report unexpected behavior with TC-SGB-API-to-List / TC-SGB-API-to-List'de beklenmeyen davranış bildir"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ## Bug Report / Hata Raporu

        Thanks for taking the time to fill out this report.
        Please fill in **either** English or Turkish sections (or both).

  - type: input
    id: python_version
    attributes:
      label: "Python Version / Python Sürümü"
      description: "Output of `python --version`"
      placeholder: "e.g. 3.12.4"
    validations:
      required: true

  - type: input
    id: os_version
    attributes:
      label: "Operating System / İşletim Sistemi"
      description: "Your OS and version"
      placeholder: "e.g. Windows 11, Ubuntu 24.04, macOS 15.1"
    validations:
      required: true

  - type: input
    id: tool_version
    attributes:
      label: "Tool Version / Araç Sürümü"
      description: "Version from pyproject.toml or pip show"
      placeholder: "e.g. 1.0.0"
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "Expected Behavior / Beklenen Davranış"
      description: "What did you expect to happen?"
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: "Actual Behavior / Gerçek Davranış"
      description: "What actually happened?"
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: "Reproduction Steps / Tekrarlama Adımları"
      description: "Exact command and parameters you used"
      placeholder: |
        python scripts/main.py fetch --limit 100
    validations:
      required: true

  - type: textarea
    id: error_output
    attributes:
      label: "Error Output / Hata Çıktısı"
      description: "Paste the full error output or traceback"
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: "Additional Context / Ek Bilgi"
      description: "Any other relevant information"
    validations:
      required: false
