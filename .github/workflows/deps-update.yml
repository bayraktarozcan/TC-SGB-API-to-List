name: Dependency Update

on:
  schedule:
    - cron: '0 6 * * 1'  # Weekly Monday 06:00 UTC
  workflow_dispatch:

concurrency:
  group: deps-update-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  update-deps:
    name: Update Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
        with:
          fetch-depth: 0

      - uses: actions/setup-python@main
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: |
            requirements.in
            requirements-dev.in

      - name: Install pip-tools
        run: pip install pip-tools

      - name: Compile updated requirements
        run: |
          pip-compile --allow-unsafe --output-file=requirements.txt requirements.in
          pip-compile --allow-unsafe --output-file=requirements-dev.txt requirements-dev.in

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet requirements.txt requirements-dev.txt; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No dependency updates available"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Dependency updates found"
          fi

      - name: Install updated deps and test
        if: steps.changes.outputs.changed == 'true'
        run: |
          pip install --upgrade certifi filelock setuptools
          pip install -r requirements-dev.txt
          pytest --tb=short -q
          ruff check Scripts/ Tests/
          ruff format --check Scripts/ Tests/
          mypy Scripts/
          bandit -r Scripts/
          pip-audit

      - name: Create PR
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCH="deps/update-dependencies-${{ github.run_id }}"
          STAMP=$(TZ=Europe/Istanbul date +'%Y-%m-%d')
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add requirements.txt requirements-dev.txt
          git commit -m "deps: update dependencies"
          git push origin "$BRANCH"
          {
            echo "Automated dependency update via pip-tools."
            echo
            echo "Changes:"
            echo '- `requirements.txt` (runtime)'
            echo '- `requirements-dev.txt` (dev)'
            echo
            echo "All quality gates passed in CI."
          } > /tmp/pr-body.md
          gh label create automated --description "Automated pull request" --color "ededed" 2>/dev/null || true
          gh label create auto-merge --description "Arm native auto-merge" --color "0e8a16" 2>/dev/null || true
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "deps: update dependencies ($STAMP)" \
            --body-file /tmp/pr-body.md \
            --label dependencies \
            --label automated \
            --label auto-merge \
            --assignee bayraktarozcan