name: Dependency Update

on:
  schedule:
    - cron: '0 6 * * 1'  # Weekly Monday 06:00 UTC
  workflow_dispatch:

concurrency:
  group: deps-update-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  update-deps:
    name: Update Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.in
            requirements-dev.in

      - name: Install pip-tools
        run: pip install pip-tools

      - name: Compile updated requirements
        run: |
          pip-compile --allow-unsafe --output-file=requirements.txt requirements.in
          pip-compile --allow-unsafe --output-file=requirements-dev.txt requirements-dev.in

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet requirements.txt requirements-dev.txt; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No dependency updates available"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Dependency updates found"
          fi

      - name: Install updated deps and test
        if: steps.changes.outputs.changed == 'true'
        run: |
          pip install -r requirements-dev.txt
          pytest --tb=short -q
          ruff check Scripts/ Tests/
          ruff format --check Scripts/ Tests/
          mypy Scripts/
          bandit -r Scripts/
          pip-audit

      - name: Create PR
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@271a8d0340265f705314b6d63b34416be5749e4c # v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: deps/update-dependencies-${{ github.run_id }}
          delete-branch: true
          title: "deps: update dependencies ($(date +'%Y-%m-%d'))"
          body: |
            Automated dependency update via pip-tools.
            
            Changes:
            - `requirements.txt` (runtime)
            - `requirements-dev.txt` (dev)
            
            All quality gates passed in CI.

          labels: |
            dependencies
            automated
          assignees: bayraktarozcan
          draft: false