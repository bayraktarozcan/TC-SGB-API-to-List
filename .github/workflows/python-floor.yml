name: Python Floor Currency

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

concurrency:
  group: python-floor
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - uses: actions/setup-python@main
        with:
          python-version: "3.x"
      - name: Compare declared floor with upstream calendar
        id: check
        shell: bash
        run: python Scripts/bump_python_floor.py check

      - name: Open floor bump PR
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.AUTO_MERGE_TOKEN }}
          DESIRED: ${{ steps.check.outputs.desired }}
          CURRENT: ${{ steps.check.outputs.current }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="chore/python-floor-${DESIRED}"

          # Idempotency: never open a second PR for the same target floor.
          EXISTING=$(gh pr list --state open --head "$BRANCH" \
            --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "PR #${EXISTING} already open for ${DESIRED}; re-arming auto-merge."
            gh pr merge --squash --auto "$EXISTING"
          else
            git checkout -b "$BRANCH"
            python Scripts/bump_python_floor.py apply "$DESIRED"
            python Scripts/bump_python_floor.py check
            if git diff --quiet; then
              echo "Floor bump produced no changes; refusing to open an empty PR."
              exit 1
            fi
            git add -A
            git commit -m "feat!: bump Python floor to ${DESIRED}"
            git push origin "$BRANCH"
            URL=$(gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "feat!: bump Python floor to ${DESIRED}" \
              --body "Python ${CURRENT} reached end of life per https://peps.python.org/api/release-cycle.json. This PR raises the compatibility floor to ${DESIRED} across manifests, CI matrices, the mypy target and documentation. Generated by the weekly Python Floor Currency workflow.")
            gh pr merge --squash --auto "$URL"
            echo "Opened floor bump PR: ${URL}"
          fi

          # Keep the PR mergeable under strict branch protection. Native
          # auto-merge does not update the branch when main advances.
          PR=$(gh pr list --state open --head "$BRANCH" \
            --json number --jq '.[0].number // empty')
          for i in $(seq 1 20); do
            STATE=$(gh pr view "$PR" --json state,mergeStateStatus \
              --jq '"\(.state)/\(.mergeStateStatus)"')
            echo "[wait ${i}] ${STATE}"
            case "$STATE" in
              MERGED/*) echo "Floor bump merged."; exit 0 ;;
              */BEHIND) gh pr update-branch --rebase "$PR" || true ;;
            esac
            sleep 30
          done
          echo "::warning::floor bump PR ${PR} still pending; it will be retried next run."
