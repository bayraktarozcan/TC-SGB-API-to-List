name: Scheduled Fetch

on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:

concurrency:
  group: scheduled-fetch
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  fetch:
    name: Fetch & Validate IoCs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ secrets.AUTO_MERGE_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Restore previous RAW snapshot for changelog diff
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.AUTO_MERGE_TOKEN }}
        run: |
          set -euo pipefail
          TAG="ioc-data"
          mkdir -p Output
          if gh release view "${TAG}" >/dev/null 2>&1 && \
             gh release download "${TAG}" \
               --pattern raw_records.json \
               --dir Output \
               --clobber >/dev/null 2>&1; then
            echo "Restored previous raw_records.json ($(wc -c < Output/raw_records.json) bytes); changelog will compute a diff."
          else
            echo "No previous snapshot available (first run); changelog will be a first-run log."
          fi

      - name: Run fetch
        run: python Scripts/main.py fetch
        env:
          TC_SGB_API_BASE_URL: ${{ vars.TC_SGB_API_BASE_URL || 'https://siberguvenlik.gov.tr' }}

      - name: Fetch external threat feeds
        continue-on-error: true
        run: python Scripts/main.py fetch-external
        env:
          TC_SGB_API_BASE_URL: ${{ vars.TC_SGB_API_BASE_URL || 'https://siberguvenlik.gov.tr' }}

      - name: Validate outputs
        run: python Scripts/main.py validate

      - name: Run tests
        run: pytest Tests/ -v --tb=short

      - name: Publish all output assets to rolling release
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.AUTO_MERGE_TOKEN }}
        run: |
          set -euo pipefail
          TAG="ioc-data"
          if ! gh release view "${TAG}" >/dev/null 2>&1; then
            gh release create "${TAG}" \
              --title "IoC Data (all formats)" \
              --notes "Rolling release: all IoC outputs (16 formats + raw_records.json + fetch logs) refreshed daily (19:00 UTC). Stable assets at https://github.com/${{ github.repository }}/releases/download/${TAG}/ — a browsable per-format catalog with raw links ships in the repo under Output/Blocklists/." \
              --target main
          fi
          shopt -s nullglob
          gh release upload "${TAG}" --clobber -- \
            Output/threat_intel_* \
            Output/raw_records.json \
            Output/Logs/*.md
          echo "All output assets published to ${TAG}"

      - name: Publish Brave-compatible filter list branch
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.AUTO_MERGE_TOKEN }}
        run: |
          set -euo pipefail
          SRC="Output/threat_intel_adguard.txt"
          if [ ! -f "${SRC}" ]; then
            echo "AdGuard output not found; skipping filter-list publish."
            echo "::warning::filter-lists branch not updated: AdGuard output missing."
            exit 0
          fi
          # GitHub blocks files >100 MiB in git and warns >50 MiB
          # (docs: "About large files on GitHub"). Stay far below both so the
          # branch never needs Git LFS (quota-metered, disabled when exceeded).
          # Skip loudly rather than failing the pipeline if the list ever
          # outgrows git; the branch keeps serving the last good snapshot.
          SIZE="$(wc -c < "${SRC}" | tr -d ' ')"
          if [ "${SIZE}" -ge 94371840 ]; then
            echo "AdGuard output ${SIZE} bytes >= 90 MiB; skipping filter-list publish."
            echo "::warning::filter-lists branch not updated: AdGuard output >= 90 MiB."
            exit 0
          fi
          if [ "${SIZE}" -ge 52428800 ]; then
            echo "WARNING: AdGuard output ${SIZE} bytes >= 50 MiB; monitor list growth."
          fi
          # Rolling single-commit branch: history is intentionally not kept, so the
          # daily ~12 MB snapshot never bloats the repository. raw.githubusercontent.com
          # serves branch files as text/plain with no redirect, which is what Brave
          # accepts as a custom filter list (release assets use an attachment
          # disposition and fail with "download failed" in Brave).
          BRANCH="filter-lists"
          WORK="$(mktemp -d)"
          git init -q -b "${BRANCH}" "${WORK}"
          # Byte-faithful staging on any OS: disable CRLF conversion so the
          # branch file is always identical to the release asset. (Without this,
          # a Windows runner would stage a normalized copy and trip the assertion.)
          git -C "${WORK}" config core.autocrlf false
          git -C "${WORK}" config user.name "github-actions[bot]"
          git -C "${WORK}" config user.email "github-actions[bot]@users.noreply.github.com"
          git -C "${WORK}" remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          # Seed with the last good snapshot so a feed that fails today keeps
          # serving yesterday's file instead of 404ing for subscribers.
          if git -C "${WORK}" fetch -q origin "${BRANCH}" 2>/dev/null; then
            git -C "${WORK}" checkout -q FETCH_HEAD -- . 2>/dev/null || true
          fi
          check_size() {
            local file="$1"
            local bytes
            bytes="$(wc -c < "${file}" | tr -d ' ')"
            if [ "${bytes}" -ge 94371840 ]; then
              echo "$(basename "${file}") ${bytes} bytes >= 90 MiB; keeping previous snapshot."
              echo "::warning::filter-lists: $(basename "${file}") >= 90 MiB, not updated."
              return 1
            fi
            if [ "${bytes}" -ge 52428800 ]; then
              echo "WARNING: $(basename "${file}") ${bytes} bytes >= 50 MiB; monitor list growth."
            fi
            echo "${bytes}"
            return 0
          }
          cp "${SRC}" "${WORK}/01-turkiye-sgb_adguard.txt"
          shopt -s nullglob
          for EXT in Output/External/*_adguard.txt; do
            if check_size "${EXT}" >/dev/null; then
              cp "${EXT}" "${WORK}/"
            fi
          done
          shopt -u nullglob
          cat > "${WORK}/README.md" <<'EOF'
          # TC-SGB `filter-lists` branch

          Rolling single-commit mirror of Brave / AdGuard custom filter lists.
          Refreshed daily by the `Scheduled Fetch` workflow; history is not kept
          (force-pushed) so daily snapshots never bloat the repo. A feed that
          fails on a given day keeps serving its last good snapshot.

          Files are numbered so Brave (which sorts subscriptions by URL) shows
          them in country order. `04` is reserved for Lithuania (NKSC), whose
          source sits behind a Cloudflare challenge and cannot be fetched yet.

          Brave'de abone ol: `brave://adblock` → Add filter list via URL:

          - Türkiye - TC-SGB:
              https://raw.githubusercontent.com/${{ github.repository }}/filter-lists/01-turkiye-sgb_adguard.txt
          - Polonya - CERT.PL:
              https://raw.githubusercontent.com/${{ github.repository }}/filter-lists/02-polonya-certpl_adguard.txt
          - Azerbaycan - Blacklist.gov.az:
              https://raw.githubusercontent.com/${{ github.repository }}/filter-lists/03-azerbaycan-blacklist_adguard.txt
          - Slovenya - CERT.SI:
              https://raw.githubusercontent.com/${{ github.repository }}/filter-lists/05-slovenya-certsi_adguard.txt
          EOF
          git -C "${WORK}" add -A
          # Prove full content is staged: a Git LFS pointer would stage ~130 bytes
          # instead of the source size. The branch tree carries no .gitattributes,
          # so LFS substitution is impossible by construction; this asserts it.
          for STAGED in 01-turkiye-sgb_adguard.txt 02-polonya-certpl_adguard.txt 03-azerbaycan-blacklist_adguard.txt 05-slovenya-certsi_adguard.txt; do
            if [ -f "${WORK}/${STAGED}" ]; then
              STAGED_SIZE="$(git -C "${WORK}" cat-file -s ":${STAGED}")"
              if [ "${STAGED}" = "01-turkiye-sgb_adguard.txt" ]; then
                if [ "${STAGED_SIZE}" -ne "${SIZE}" ]; then
                  echo "Staged blob size mismatch for ${STAGED}; refusing to push."
                  exit 1
                fi
              elif [ "${STAGED_SIZE}" -lt 100 ]; then
                echo "Staged blob suspiciously small for ${STAGED}; refusing to push."
                exit 1
              fi
            fi
          done
          if git -C "${WORK}" diff --cached --quiet; then
            echo "Filter lists unchanged; branch already current."
            exit 0
          fi
          git -C "${WORK}" commit -q -m "chore: update Brave/AdGuard filter lists $(date -u +%Y%m%d-%H%M%S)"
          git -C "${WORK}" push --force origin "${BRANCH}"
          echo "Published filter lists to branch ${BRANCH}"

      - name: Write Output catalog (manifest + Blocklists)
        run: python Scripts/main.py index

      - name: Commit, create PR, and auto-merge if changed
        env:
          GH_TOKEN: ${{ secrets.AUTO_MERGE_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f Output/manifest.json Output/Blocklists
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          # Retry gh calls that fail with transient API errors (e.g. HTTP 502).
          # The PR URL (stdout of the wrapped command) is preserved because the
          # helper's own messages go to stderr.
          gh_retry() {
            local attempt=0
            until "$@"; do
              attempt=$((attempt + 1))
              if [ "$attempt" -ge 5 ]; then
                echo "gh API call still failing after ${attempt} attempts: $*" >&2
                return 1
              fi
              echo "Transient gh failure (attempt ${attempt}/5); retrying: $*" >&2
              sleep $((attempt * 10))
            done
          }

          TIMESTAMP=$(date -u +"%Y%m%d-%H%M%S")
          BRANCH="scheduled-fetch-${TIMESTAMP}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          # Never more than one open scheduled-fetch PR at a time.
          # Supersede a stuck one (behind main or with failing checks) so stale
          # branches don't pile up. If the open PR is still on track, re-arm
          # auto-merge on it (a prior run may have created the PR but aborted in a
          # transient API failure before enabling auto-merge) and let it merge.
          for NUM in $(gh pr list --state open --json number,headRefName \
              --jq '.[] | select(.headRefName | startswith("scheduled-fetch-")) | .number'); do
            STUCK=$(gh pr view "$NUM" --json mergeStateStatus,statusCheckRollup \
              --jq '(.mergeStateStatus == "BEHIND") or
                    ([.statusCheckRollup[]? | select(.status == "COMPLETED" and
                      (.conclusion == "FAILURE" or .conclusion == "CANCELLED"))] | length) > 0')
            if [ "$STUCK" = "true" ]; then
              HEAD=$(gh pr view "$NUM" --json headRefName --jq '.headRefName')
              echo "Superseding stuck PR #${NUM} (branch ${HEAD})"
              gh pr close "$NUM" --comment "Superseded by newer IoC data run." || true
              git push origin --delete "$HEAD" 2>/dev/null || true
            else
              echo "Open scheduled PR #${NUM} is still on track; re-arming auto-merge."
              gh_retry gh pr merge --squash --auto --delete-branch "$NUM" || \
                echo "WARNING: could not arm auto-merge on PR #${NUM}; will be retried next run."
              exit 0
            fi
          done

          git checkout -b "${BRANCH}"
          git commit -m "chore: update IoC data ${TIMESTAMP}"
          gh_retry git push origin "${BRANCH}"

          if ! PR_URL=$(gh_retry gh pr create \
              --base main \
              --head "${BRANCH}" \
              --title "chore: update IoC data ${TIMESTAMP}" \
              --body "Automated IoC data update from scheduled pipeline.

          ${RUN_URL}"); then
            # A transient API error (e.g. HTTP 502) may have created the PR but
            # dropped the response. Recover by looking the PR up instead of failing.
            echo "gh pr create reported an error; checking whether the PR already exists."
            PR_URL=$(gh pr list --head "${BRANCH}" --state open \
              --json url --jq '.[0].url // empty' 2>/dev/null || true)
            if [ -z "$PR_URL" ]; then
              echo "PR creation failed and no recovery PR was found."
              exit 1
            fi
            echo "Recovered existing PR: ${PR_URL}"
          fi
          echo "Created PR: ${PR_URL}"
          gh_retry gh pr merge --squash --auto --delete-branch "${PR_URL}" || \
            echo "WARNING: could not arm auto-merge on ${PR_URL}; will be retried next run."

          # Keep the PR mergeable under strict branch protection: native auto-merge does
          # NOT update the branch, so if main advances while checks run, update it here.
          for i in $(seq 1 20); do
            STATE=$(gh pr view "${PR_URL}" --json state,mergeStateStatus \
              --jq '"\(.state)/\(.mergeStateStatus)"')
            echo "[wait ${i}] ${STATE}"
            case "$STATE" in
              MERGED/*) echo "✓ Merged"; exit 0 ;;
              */BEHIND) echo "  main advanced; updating branch"; gh_retry gh pr update-branch "${PR_URL}" || true ;;
              *) : ;; # checks pending or failing — keep waiting
            esac
            sleep 30
          done
          echo "Auto-merge still pending after wait window; PR left open."
