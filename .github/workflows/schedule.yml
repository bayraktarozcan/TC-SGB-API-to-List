name: Scheduled Fetch

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    name: Fetch & Validate IOCs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run fetch
        run: python -m scripts.src.fetch
        env:
          TC_SGB_API_BASE_URL: ${{ vars.TC_SGB_API_BASE_URL }}
          TC_SGB_API_KEY: ${{ secrets.TC_SGB_API_KEY }}
          TC_SGB_API_SECRET: ${{ secrets.TC_SGB_API_SECRET }}

      - name: Validate outputs
        run: python -m scripts.src.validate

      - name: Run tests
        run: pytest tests/ -v --tb=short

      - name: Commit outputs if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
            git commit -m "chore: update IOC data [skip ci] ${TIMESTAMP}"
            git push
          fi

  release:
    name: Tag & Release
    runs-on: ubuntu-latest
    needs: fetch
    if: success()
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for version tag
        id: tag
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          COMMIT_COUNT=$(git rev-list --count ${LATEST_TAG:+${LATEST_TAG}..}HEAD)
          if [ "$COMMIT_COUNT" -gt 0 ]; then
            echo "new_commits=true" >> "$GITHUB_OUTPUT"
            echo "commit_count=${COMMIT_COUNT}" >> "$GITHUB_OUTPUT"
          else
            echo "new_commits=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        if: steps.tag.outputs.new_commits == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-${{ github.run_number }}
          name: "IOC Data Update #${{ github.run_number }}"
          generate_release_notes: true
          make_latest: false
