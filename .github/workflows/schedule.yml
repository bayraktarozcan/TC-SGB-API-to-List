name: Scheduled Fetch

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  fetch:
    name: Fetch & Validate IOCs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run fetch
        run: python scripts/main.py fetch
        env:
          TC_SGB_API_BASE_URL: ${{ vars.TC_SGB_API_BASE_URL }}

      - name: Validate outputs
        run: python scripts/main.py validate

      - name: Run tests
        run: pytest tests/ -v --tb=short

      - name: Commit, create PR, and auto-merge if changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f output/
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          TIMESTAMP=$(date -u +"%Y%m%d-%H%M%S")
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          git checkout -b scheduled-fetch
          git commit -m "chore: update IOC data ${TIMESTAMP}"
          git push --force origin scheduled-fetch
          gh pr create \
            --base main \
            --head scheduled-fetch \
            --title "chore: update IOC data ${TIMESTAMP}" \
            --body "Automated IoC data update from scheduled pipeline.

${RUN_URL}" \
            2>&1 || echo "PR already exists — branch updated"
          gh pr merge --auto --squash --delete-branch 2>&1 || true
