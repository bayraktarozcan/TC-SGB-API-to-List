name: Scheduled Fetch

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  fetch:
    name: Fetch & Validate IOCs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run fetch
        run: python scripts/main.py fetch
        env:
          TC_SGB_API_BASE_URL: ${{ vars.TC_SGB_API_BASE_URL }}

      - name: Validate outputs
        run: python scripts/main.py validate

      - name: Run tests
        run: pytest tests/ -v --tb=short

      - name: Commit outputs if changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f output/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            TIMESTAMP=$(date -u +"%Y%m%d-%H%M%S")
            BRANCH="ioc-update/${TIMESTAMP}"
            git checkout -b "$BRANCH"
            git commit -m "chore: update IOC data ${TIMESTAMP}"
            git push -u origin "$BRANCH"
            gh pr create \
              --title "chore: IOC data update ${TIMESTAMP}" \
              --body "Automated IOC data update from scheduled fetch. ${TIMESTAMP}" \
              --head "$BRANCH" \
              --base main
            PR_NUMBER=$(gh pr list --head "$BRANCH" --json number --jq '.[0].number')
            gh pr merge "$PR_NUMBER" --squash --auto --delete-branch
          fi
