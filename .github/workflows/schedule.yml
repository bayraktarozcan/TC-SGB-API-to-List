name: Scheduled Fetch

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  fetch:
    name: Fetch & Validate IoCs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.AUTO_MERGE_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run fetch
        run: python scripts/main.py fetch
        env:
          TC_SGB_API_BASE_URL: ${{ vars.TC_SGB_API_BASE_URL || 'https://siberguvenlik.gov.tr' }}

      - name: Validate outputs
        run: python scripts/main.py validate

      - name: Run tests
        run: pytest tests/ -v --tb=short

      - name: Publish large-format assets to rolling release
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.AUTO_MERGE_TOKEN }}
        run: |
          set -euo pipefail
          TAG="ioc-data"
          if ! gh release view "${TAG}" >/dev/null 2>&1; then
            gh release create "${TAG}" \
              --title "IoC Data (large formats)" \
              --notes "Rolling release: large-format IoC outputs refreshed every 6 hours. Stable assets at https://github.com/${{ github.repository }}/releases/download/${TAG}/" \
              --target main
          fi
          gh release upload "${TAG}" --clobber -- \
            output/threat_intel_json.json \
            output/threat_intel_yaml.yaml \
            output/threat_intel_sqlite.db \
            output/raw_records.json \
            output/threat_intel_suricata.json
          echo "Large-format assets published to ${TAG}"

      - name: Commit, create PR, and auto-merge if changed
        env:
          GH_TOKEN: ${{ secrets.AUTO_MERGE_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f output/ ':!output/raw_records.json' \
            ':!output/threat_intel_json.json' \
            ':!output/threat_intel_sqlite.db' \
            ':!output/threat_intel_suricata.json' \
            ':!output/threat_intel_yaml.yaml'
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          # Retry gh calls that fail with transient API errors (e.g. HTTP 502).
          # The PR URL (stdout of the wrapped command) is preserved because the
          # helper's own messages go to stderr.
          gh_retry() {
            local attempt=0
            until "$@"; do
              attempt=$((attempt + 1))
              if [ "$attempt" -ge 5 ]; then
                echo "gh API call still failing after ${attempt} attempts: $*" >&2
                return 1
              fi
              echo "Transient gh failure (attempt ${attempt}/5); retrying: $*" >&2
              sleep $((attempt * 10))
            done
          }

          TIMESTAMP=$(date -u +"%Y%m%d-%H%M%S")
          BRANCH="scheduled-fetch-${TIMESTAMP}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          # Never more than one open scheduled-fetch PR at a time.
          # Supersede a stuck one (behind main or with failing checks) so stale
          # branches don't pile up. If the open PR is still on track, re-arm
          # auto-merge on it (a prior run may have created the PR but aborted in a
          # transient API failure before enabling auto-merge) and let it merge.
          for NUM in $(gh pr list --state open --json number,headRefName \
              --jq '.[] | select(.headRefName | startswith("scheduled-fetch-")) | .number'); do
            STUCK=$(gh pr view "$NUM" --json mergeStateStatus,statusCheckRollup \
              --jq '(.mergeStateStatus == "BEHIND") or
                    ([.statusCheckRollup[]? | select(.status == "COMPLETED" and
                      (.conclusion == "FAILURE" or .conclusion == "CANCELLED"))] | length) > 0')
            if [ "$STUCK" = "true" ]; then
              HEAD=$(gh pr view "$NUM" --json headRefName --jq '.headRefName')
              echo "Superseding stuck PR #${NUM} (branch ${HEAD})"
              gh pr close "$NUM" --comment "Superseded by newer IoC data run." || true
              git push origin --delete "$HEAD" 2>/dev/null || true
            else
              echo "Open scheduled PR #${NUM} is still on track; re-arming auto-merge."
              gh_retry gh pr merge --squash --auto --delete-branch "$NUM" || \
                echo "WARNING: could not arm auto-merge on PR #${NUM}; will be retried next run."
              exit 0
            fi
          done

          git checkout -b "${BRANCH}"
          git commit -m "chore: update IoC data ${TIMESTAMP}"
          gh_retry git push origin "${BRANCH}"

          if ! PR_URL=$(gh_retry gh pr create \
              --base main \
              --head "${BRANCH}" \
              --title "chore: update IoC data ${TIMESTAMP}" \
              --body "Automated IoC data update from scheduled pipeline.

          ${RUN_URL}"); then
            # A transient API error (e.g. HTTP 502) may have created the PR but
            # dropped the response. Recover by looking the PR up instead of failing.
            echo "gh pr create reported an error; checking whether the PR already exists."
            PR_URL=$(gh pr list --head "${BRANCH}" --state open \
              --json url --jq '.[0].url // empty' 2>/dev/null || true)
            if [ -z "$PR_URL" ]; then
              echo "PR creation failed and no recovery PR was found."
              exit 1
            fi
            echo "Recovered existing PR: ${PR_URL}"
          fi
          echo "Created PR: ${PR_URL}"
          gh_retry gh pr merge --squash --auto --delete-branch "${PR_URL}" || \
            echo "WARNING: could not arm auto-merge on ${PR_URL}; will be retried next run."

          # Keep the PR mergeable under strict branch protection: native auto-merge does
          # NOT update the branch, so if main advances while checks run, update it here.
          for i in $(seq 1 20); do
            STATE=$(gh pr view "${PR_URL}" --json state,mergeStateStatus \
              --jq '"\(.state)/\(.mergeStateStatus)"')
            echo "[wait ${i}] ${STATE}"
            case "$STATE" in
              MERGED/*) echo "✓ Merged"; exit 0 ;;
              */BEHIND) echo "  main advanced; updating branch"; gh_retry gh pr update-branch "${PR_URL}" || true ;;
              *) : ;; # checks pending or failing — keep waiting
            esac
            sleep 30
          done
          echo "Auto-merge still pending after wait window; PR left open."
