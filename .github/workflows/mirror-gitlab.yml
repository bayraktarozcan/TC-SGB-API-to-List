name: Mirror GitLab

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitlab-mirror
  cancel-in-progress: false

env:
  GITLAB_PUSH_TOKEN: ${{ secrets.GITLAB_PUSH_TOKEN }}

jobs:
  mirror:
    name: Mirror main and release to GitLab
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.AUTO_MERGE_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/refresh-gitlab-release