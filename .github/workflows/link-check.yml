# TC-SGB-API-to-List — Link Check
# Checks Markdown links weekly and on PRs touching docs. Fails only in Actions tab.

name: "Link Check"

on:
  schedule:
    - cron: "30 6 * * 1"
  pull_request:
    branches: [main]
    paths:
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: link-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lychee:
    name: Check Links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - name: Check links
        uses: lycheeverse/lychee-action@master
        with:
          # file:// = author-machine absolute paths, never valid in CI
          # compare/{...} = release-note template placeholders, filled per release
          args: >-
            --no-progress --verbose --max-retries 2 --exclude '^file://'
            --exclude 'compare/%7B'
            --exclude '^https://www\.iso\.org/standard/77520\.html$'
            --exclude '^https://www\.iso\.org/standard/86308\.html$'
            --exclude '^https://www\.iso\.org/standard/86612\.html$'
            --exclude '^https://www\.cisco\.com/c/en/us/about/legal/cloud-and-software/end_user_license_agreement\.html$'
            './**/*.md'
          fail: true