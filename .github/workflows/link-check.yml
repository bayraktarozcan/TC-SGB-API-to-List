# TC-SGB-API-to-List — Link Check
# Checks Markdown links weekly and on PRs touching docs. Fails only in Actions tab.

name: "Link Check"

on:
  schedule:
    - cron: "30 6 * * 1"
  pull_request:
    branches: [main]
    paths:
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: link-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lychee:
    name: Check Links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          # file:// = author-machine absolute paths, never valid in CI
          # compare/{...} = release-note template placeholders, filled per release
          args: >-
            --no-progress --verbose --max-retries 2 --exclude '^file://'
            --exclude 'compare/%7B'
            './**/*.md'
          fail: true