name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main

      - uses: actions/setup-python@main
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check Scripts/ Tests/

      - name: Ruff format check
        run: ruff format --check Scripts/ Tests/

      - name: Mypy
        run: mypy Scripts/

      - name: Mojibake scan (HEAD)
        run: python Scripts/src/mojibake.py --scope head

  test:
    name: Test (unit) - Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ["3.11", "3.x"]
    steps:
      - uses: actions/checkout@main

      - uses: actions/setup-python@main
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest -m "not slow" --cov=Scripts --cov-report=xml --cov-report=term-missing -v

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@main
        with:
          name: coverage-report
          path: coverage.xml

  perf:
    name: Test (performance) - Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ["3.11", "3.x"]
    steps:
      - uses: actions/checkout@main

      - uses: actions/setup-python@main
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run performance tests
        run: pytest -m slow --tb=short -v

  security:
    name: Security Scan - Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ["3.11", "3.x"]
    steps:
      - uses: actions/checkout@main

      - uses: actions/setup-python@main
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Upgrade transitive deps to latest secure versions
        run: |
          pip install --upgrade certifi filelock setuptools

      - name: pip-audit
        run: pip-audit

      - name: Bandit security scan
        run: bandit -r Scripts/ -f json -o bandit-report.json

      - name: Bandit summary
        if: always()
        run: bandit -r Scripts/

      - name: Upload bandit report
        if: always()
        uses: actions/upload-artifact@main
        with:
          name: bandit-report
          path: bandit-report.json

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@master # master, not main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  build:
    name: Build - Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    needs: [test, security]
    strategy:
      matrix:
        python-version: ["3.11", "3.x"]
    steps:
      - uses: actions/checkout@main

      - uses: actions/setup-python@main
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package
        run: python -m build

      - name: Upload dist artifacts
        uses: actions/upload-artifact@main
        with:
          name: dist
          path: dist/
