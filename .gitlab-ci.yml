---
image: python:3.11-slim@sha256:9534e5a8e315485d4061ed659af0fd78a284c015f9b73661b41d6bab25604534

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PIP_NO_CACHE_DIR: "0"

default:
  interruptible: true
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "pipeline"
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - when: never

cache:
  key:
    files:
      - requirements.txt
      - pyproject.toml
  paths:
    - .cache/pip

stages:
  - lint
  - test
  - security
  - build

.deps_base: &deps_base
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends git && rm -rf /var/lib/apt/lists/*
    - python -m pip install --upgrade pip setuptools wheel
    - pip install -e ".[dev]"

lint:
  <<: *deps_base
  stage: lint
  script:
    - ruff check scripts/ tests/
    - ruff format --check scripts/ tests/
    - mypy scripts/
    - python scripts/src/mojibake.py

test:
  <<: *deps_base
  stage: test
  needs:
    - lint
  coverage: '/(?:^|\s)TOTAL\s+\d+\s+\d+\s+(\d+(?:\.\d+)?)%/'
  script:
    - pytest -m "not slow" --cov=scripts --cov-report=xml --cov-report=term-missing -v
  artifacts:
    when: always
    paths:
      - coverage.xml
    expire_in: 7 days

perf:
  <<: *deps_base
  stage: test
  needs:
    - lint
  script:
    - pytest -m slow --tb=short -v

security:
  <<: *deps_base
  stage: security
  needs:
    - lint
  script:
    - pip-audit --ignore-vuln PYSEC-2026-1845 --ignore-vuln PYSEC-2026-3447
    - bandit -r scripts/ -f json -o bandit-report.json
    - bandit -r scripts/
  artifacts:
    when: always
    paths:
      - bandit-report.json
    expire_in: 7 days

secret-scan:
  stage: security
  needs: []
  script:
    - apt-get update && apt-get install -y --no-install-recommends curl ca-certificates git && rm -rf /var/lib/apt/lists/*
    - curl -sSL -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
    - echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum -c -
    - tar xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
    - /tmp/gitleaks detect --source . -v

# Full-history blob scan. Enable weekly via a GitLab schedule with the
# MOJIBAKE_DEEP="true" variable (schedule pipelines are allowed above).
deep-mojibake:
  stage: security
  needs: []
  rules:
    - if: '$MOJIBAKE_DEEP == "true"'
  script:
    - python scripts/src/mojibake.py --scope history

build:
  stage: build
  needs:
    - test
    - security
  before_script:
    - python -m pip install --upgrade pip setuptools wheel
    - pip install build==1.6.1
  script:
    - python -m build
  artifacts:
    when: on_success
    paths:
      - dist/
    expire_in: 7 days