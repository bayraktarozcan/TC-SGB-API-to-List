---
image: python:slim

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PIP_NO_CACHE_DIR: "0"

default:
  interruptible: true
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "pipeline"
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - when: never

cache:
  key:
    files:
      - requirements.txt
      - pyproject.toml
  paths:
    - .cache/pip

stages:
  - lint
  - test
  - security
  - build

.deps_base: &deps_base
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends git && rm -rf /var/lib/apt/lists/*
    - python -m pip install --upgrade pip setuptools wheel
    - pip install -e ".[dev]"

lint:
  <<: *deps_base
  stage: lint
  script:
    - ruff check Scripts/ Tests/
    - ruff format --check Scripts/ Tests/
    - mypy Scripts/
    - python Scripts/src/mojibake.py

test:
  stage: test
  parallel:
    matrix:
      - PYTHON_VERSION: "3.11"
      - PYTHON_VERSION: "latest"
  image: python:${PYTHON_VERSION}
  needs:
    - lint
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends git && rm -rf /var/lib/apt/lists/*
    - python -m pip install --upgrade pip setuptools wheel
    - pip install -e ".[dev]"
  coverage: '/(?:^|\s)TOTAL\s+\d+\s+\d+\s+(\d+(?:\.\d+)?)%/'
  script:
    - pytest -m "not slow" --cov=Scripts --cov-report=xml --cov-report=term-missing -v
  artifacts:
    when: always
    paths:
      - coverage.xml
    expire_in: 7 days

perf:
  <<: *deps_base
  stage: test
  needs:
    - lint
  script:
    - pytest -m slow --tb=short -v

security:
  <<: *deps_base
  stage: security
  needs:
    - lint
  script:
    - pip install --upgrade certifi filelock setuptools
    - pip-audit
    - bandit -r Scripts/ -f json -o bandit-report.json
    - bandit -r Scripts/
  artifacts:
    when: always
    paths:
      - bandit-report.json
    expire_in: 7 days

secret-scan:
  stage: security
  needs: []
  script:
    - apt-get update && apt-get install -y --no-install-recommends curl ca-certificates git && rm -rf /var/lib/apt/lists/*
    - VER=$(curl -sSL https://api.github.com/repos/gitleaks/gitleaks/releases/latest | grep -oE '"tag_name"[[:space:]]*:[[:space:]]*"v[0-9]+(\.[0-9]+)*"' | grep -oE 'v[0-9]+(\.[0-9]+)*')
    - NUM=$(echo "$VER" | sed 's/^v//')
    - echo "Latest gitleaks: $VER"
    - curl -sSL -o /tmp/gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/${VER}/gitleaks_${NUM}_linux_x64.tar.gz"
    - curl -sSL -o /tmp/checksums.txt "https://github.com/gitleaks/gitleaks/releases/download/${VER}/gitleaks_${NUM}_checksums.txt"
    - cd /tmp && grep "gitleaks_${NUM}_linux_x64.tar.gz" checksums.txt | sha256sum -c - && cd -
    - tar xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
    - /tmp/gitleaks detect --source . -v

# Full-history blob scan. Enable weekly via a GitLab schedule with the
# MOJIBAKE_DEEP="true" variable (schedule pipelines are allowed above).
deep-mojibake:
  stage: security
  needs: []
  rules:
    - if: '$MOJIBAKE_DEEP == "true"'
  script:
    - python Scripts/src/mojibake.py --scope history

# Mirror of .github/workflows/link-check.yml (lychee). Runs on MR/default-branch
# doc changes, weekly schedules, and web (manual) pipelines.
link-check:
  stage: lint
  needs: []
  image:
    name: lycheeverse/lychee:latest
    entrypoint: [""]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - "**/*.md"
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - "**/*.md"
    - when: never
  script:
    - >-
      lychee --no-progress --verbose --max-retries 2
      --exclude '^file://'
      --exclude 'compare/%7B'
      --exclude '^https://www\.iso\.org/standard/77520\.html$'
      --exclude '^https://www\.iso\.org/standard/86308\.html$'
      --exclude '^https://www\.iso\.org/standard/86612\.html$'
      --exclude '^https://www\.cisco\.com/c/en/us/about/legal/cloud-and-software/end_user_license_agreement\.html$'
      './**/*.md'

build:
  stage: build
  needs:
    - test
    - security
  before_script:
    - python -m pip install --upgrade pip setuptools wheel
    - pip install build
  script:
    - python -m build
  artifacts:
    when: on_success
    paths:
      - dist/
    expire_in: 7 days
